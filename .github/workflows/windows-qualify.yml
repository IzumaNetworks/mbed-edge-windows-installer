name: Qualify existing signed Windows MSI
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Windows MSI workflow run whose package job succeeded
        required: true
        type: string
      fixture_ref:
        description: Optional Core ref to regenerate synthetic test credentials
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: windows-2022
    environment: windows-signing
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the existing signed build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.release_run_id }}
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$' -or -not $env:SIGNER_SUBJECT) { throw 'Supply a build run and configure the signer subject.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.path -ne '.github/workflows/windows-msi.yml' -or $run.event -ne 'workflow_dispatch') { throw 'Select the manual signed MSI workflow.' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'package' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'The signed package job must have succeeded.' }
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name izuma-edge-windows-x64-signed --dir build/release
          if ($LASTEXITCODE -ne 0) { throw 'Signed artifact download failed.' }
          $artifacts=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect qualification fixtures.' }
          if ($artifacts.artifacts.name -contains 'izuma-edge-synthetic-provisioning-fixture') {
            gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name izuma-edge-synthetic-provisioning-fixture --dir build/fixture
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture download failed.' }
          }
          $source = Get-Content build/release/source.json -Raw | ConvertFrom-Json
          if ($source.installerCommit -cne $run.head_sha) { throw 'Installer source does not match the selected build.' }
          foreach ($line in Get-Content build/release/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([^\\/]+)$') { throw 'Malformed checksum.' }
            if ((Get-FileHash -LiteralPath (Join-Path "$pwd/build/release" $Matches[2])).Hash.ToLowerInvariant() -cne $Matches[1]) { throw 'Artifact checksum mismatch.' }
          }
          $msi = @(Get-ChildItem build/release -Filter '*.msi')
          if ($msi.Count -ne 1 -or $msi[0].Name -notmatch '^izuma-edge-(\d+\.\d+\.\d+)-windows-x64.msi$') { throw 'Expected one release MSI.' }
          $version = $Matches[1]
          $signature = Get-AuthenticodeSignature -LiteralPath $msi[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -cne $env:SIGNER_SUBJECT) { throw 'Unexpected MSI signature.' }
          Expand-Archive -LiteralPath "build/release/edge-core-$version-windows-x64-signed.zip" -DestinationPath build/core-package
          @{version=$version;msi=$msi[0].FullName;core="$pwd/build/core-package/edge-core-$version-windows-x64"} | ConvertTo-Json | Set-Content build/qualification-source.json -Encoding UTF8
      - uses: actions/checkout@v4
        if: inputs.fixture_ref != ''
        with:
          repository: PelionIoT/mbed-edge
          ref: ${{ inputs.fixture_ref }}
          path: build/core-source
      - uses: ilammy/msvc-dev-cmd@v1
        if: inputs.fixture_ref != ''
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        if: inputs.fixture_ref != ''
        id: fixture-openssl
        with:
          path: |
            build/core-source/build/openssl/install
            build/core-source/build/openssl/openssl-3.5.9/LICENSE.txt
          key: windows-2022-openssl-3.5.9-${{ env.VCToolsVersion }}-${{ hashFiles('build/core-source/windows/build-openssl.ps1') }}
      - name: Build fixture OpenSSL SDK if needed
        if: inputs.fixture_ref != '' && steps.fixture-openssl.outputs.cache-hit != 'true'
        working-directory: build/core-source
        run: ./windows/build-openssl.ps1 -OutputDirectory ./build/openssl
      - name: Generate corrected synthetic credential fixture
        if: inputs.fixture_ref != ''
        run: |
          cmake -E env --unset=Path --unset=PATH "Path=$env:PATH" MSBUILDDISABLENODEREUSE=1 cmake -S build/core-source/edge-tool/native -B build/fixture-native -DOPENSSL_ROOT_DIR="$pwd/build/core-source/build/openssl/install"
          if ($LASTEXITCODE) { throw 'Native fixture configuration failed.' }
          cmake -E env --unset=Path --unset=PATH "Path=$env:PATH" MSBUILDDISABLENODEREUSE=1 cmake --build build/fixture-native --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Native fixture build failed.' }
          New-Item -ItemType Directory build/fixture -Force | Out-Null
          ./build/fixture-native/Release/edge-provision-tests.exe --write-fixture build/fixture/provisioning-fixture.c
          if ($LASTEXITCODE) { throw 'Native fixture generation failed.' }
          @{fixtureCommit=(git -C build/core-source rev-parse HEAD)} | ConvertTo-Json | Set-Content build/fixture/source.json
      - name: Qualify runtime absence, install, repair and reinstall
        run: |
          $source = Get-Content build/qualification-source.json -Raw | ConvertFrom-Json
          $extra=@{}
          if (Test-Path build/fixture/provisioning-fixture.c) { $extra.DeveloperFixturePath="$pwd/build/fixture/provisioning-fixture.c" }
          ./test/windows-core/test-msi-release.ps1 -MsiPath $source.msi -CorePackageDirectory $source.core -OutputDirectory build/msi-tests @extra
      - name: Record qualification source
        if: always()
        env:
          SOURCE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          New-Item -ItemType Directory build/msi-tests -Force | Out-Null
          @{sourceRunId=$env:SOURCE_RUN_ID;qualificationCommit=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content build/msi-tests/source.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izuma-edge-msi-qualification
          path: build/msi-tests/
          retention-days: 30
