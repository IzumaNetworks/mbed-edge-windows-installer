name: Signed Windows MSI
run-name: Signed Windows MSI (${{ inputs.release_id || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: Optional successful signed Core run ID; leave empty to build everything here
        required: false
        type: string
      core_ref:
        description: Core source branch, tag or commit when building everything here
        default: experiment/win10support
        required: false
        type: string
      version:
        description: Release version (major.minor.patch) when building everything here
        required: false
        type: string
      monitor_ref:
        description: Reviewed edge-core-monitor commit or tag
        required: true
        type: string
      release_id:
        description: Optional identifier supplied by the full release script
        required: false
        type: string

permissions:
  contents: read

jobs:
  portable-converter:
    if: inputs.core_run_id == ''
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PelionIoT/mbed-edge
          ref: ${{ inputs.core_ref }}
      - name: Build and test portable native converter
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            cmake -S edge-tool/native -B build/provision -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          else
            cmake -S edge-tool/native -B build/provision
          fi
          cmake --build build/provision --parallel 2
          ctest --test-dir build/provision --output-on-failure
  package:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.source.outputs.version }}
    environment: windows-signing
    env:
      DOTNET_ROLL_FORWARD: Major
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Check release orchestration without credentials
        run: ./test/windows-core/test-release-orchestration.ps1 -OutputDirectory build/release-orchestration-tests
      - name: Check release configuration
        env:
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          CORE_REF: ${{ inputs.core_ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        run: |
          if ($env:CORE_RUN_ID) {
            if ($env:CORE_RUN_ID -notmatch '^\d+$') { throw 'core_run_id must be numeric.' }
          } else {
            if (-not $env:CORE_REF -or $env:CORE_REF -match '[\r\n]') { throw 'Supply a Core source ref.' }
            if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Supply version as major.minor.patch for a full build.' }
          }
          foreach ($name in @('SIGNER_SUBJECT','SIGNING_PROFILE','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','SIGNING_ACCOUNT','SIGNING_ENDPOINT')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Configure windows-signing variable $name." }
          }
      - name: Download signed core artifact using gh
        if: inputs.core_run_id != ''
        id: core
        env:
          GH_TOKEN: ${{ secrets.CORE_ARTIFACT_READ_TOKEN }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'Configure CORE_ARTIFACT_READ_TOKEN with Actions read access to PelionIoT/mbed-edge.' }
          $run = gh api "repos/PelionIoT/mbed-edge/actions/runs/$env:CORE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows-release.yml') { throw 'Select a successful signed Windows release workflow run.' }
          gh run download $env:CORE_RUN_ID --repo PelionIoT/mbed-edge --name edge-core-windows-x64-signed --dir build/core-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Signed core artifact download failed.' }
          $metadata = Get-Content build/core-runtime/build.json -Raw | ConvertFrom-Json
          if ($metadata.commit -ne $run.head_sha -or $metadata.profile -ne 'BYOC/OpenSSL/Release' -or $metadata.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Core artifact provenance or profile mismatch.' }
          "commit=$($run.head_sha)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($metadata.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          repository: PelionIoT/mbed-edge
          ref: ${{ steps.core.outputs.commit || inputs.core_ref }}
          submodules: recursive
          path: build/core-source
      - uses: actions/checkout@v4
        with:
          repository: IzumaNetworks/edge-core-monitor
          ref: ${{ inputs.monitor_ref }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: build/monitor
      - name: Record exact Core source and validate release version
        id: source
        env:
          EXPECTED_COMMIT: ${{ steps.core.outputs.commit }}
          RELEASE_VERSION: ${{ steps.core.outputs.version || inputs.version }}
        run: |
          $commit = git -C build/core-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot identify Core source commit.' }
          if ($env:EXPECTED_COMMIT -and $commit -cne $env:EXPECTED_COMMIT) { throw 'Core source differs from the downloaded artifact.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Use major.minor.patch.' }
          $version = [version]$env:RELEASE_VERSION
          if ($version.Major -gt 255 -or $version.Minor -gt 255 -or $version.Build -gt 65535) { throw 'Version exceeds MSI limits.' }
          "commit=$commit" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$env:RELEASE_VERSION" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Check Azure sign-in before compilation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare signing check
        run: |
          New-Item -ItemType Directory build/signing-check | Out-Null
          'Izuma Edge signing workflow preflight' | Set-Content build/signing-check/check.txt
          New-FileCatalog -Path build/signing-check -CatalogFilePath build/signing-check.cat -CatalogVersion 2.0 | Out-Null
      - name: Check certificate profile signing before compilation
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\signing-check.cat
          exclude-environment-credential: true
      - name: Verify signing check
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: ./build/core-source/windows/verify-signatures.ps1 -Path build/signing-check.cat -ExpectedSubject $env:SIGNER_SUBJECT
      - uses: ilammy/msvc-dev-cmd@v1
        if: inputs.core_run_id == ''
        with:
          arch: x64
      - name: Restore pinned OpenSSL SDK
        if: inputs.core_run_id == ''
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/core-source/build/openssl/install
            build/core-source/build/openssl/openssl-3.5.9/LICENSE.txt
          key: windows-2022-openssl-3.5.9-${{ env.VCToolsVersion }}-${{ hashFiles('build/core-source/windows/build-openssl.ps1') }}
      - name: Build pinned OpenSSL SDK
        if: inputs.core_run_id == '' && steps.openssl-cache.outputs.cache-hit != 'true'
        working-directory: build/core-source
        run: ./windows/build-openssl.ps1 -OutputDirectory ./build/openssl
      - name: Save pinned OpenSSL SDK
        if: inputs.core_run_id == '' && steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/core-source/build/openssl/install
            build/core-source/build/openssl/openssl-3.5.9/LICENSE.txt
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - name: Build and test Core
        if: inputs.core_run_id == ''
        working-directory: build/core-source
        run: |
          ./build-windows.ps1 -Configuration Release -OpenSSLRoot "$pwd/build/openssl/install" -Jobs 4 -CMakeArgument '-DCMAKE_POLICY_VERSION_MINIMUM=3.5','-DEDGE_WINDOWS_TESTS=ON'
          cmake --build build/windows-x64 --config Release --target windows-core-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native Core test build failed.' }
          ctest --test-dir build/windows-x64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native Core tests failed.' }
          ./build/windows-x64/bin/Release/edge-provision-tests.exe --write-fixture build/provisioning-fixture.c
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic provisioning fixture generation failed.' }
      - uses: actions/upload-artifact@v4
        if: inputs.core_run_id == ''
        with:
          name: izuma-edge-synthetic-provisioning-fixture
          path: build/core-source/build/provisioning-fixture.c
          if-no-files-found: error
          retention-days: 1
      - name: Stage Core runtime
        if: inputs.core_run_id == ''
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CORE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $stage = New-Item -ItemType Directory build/core-runtime
          foreach ($name in @('edge-core.exe','edge-provision.exe','event.dll','event_core.dll','libcrypto-3-x64.dll','libssl-3-x64.dll')) {
            Copy-Item -LiteralPath "build/core-source/build/windows-x64/bin/Release/$name" -Destination $stage
          }
          Copy-Item build/core-source/LICENSE "$stage/edge-LICENSE.txt"
          Copy-Item build/core-source/build/openssl/openssl-3.5.9/LICENSE.txt "$stage/openssl-LICENSE.txt"
          @{version=$env:RELEASE_VERSION;commit=$env:CORE_COMMIT;profile='BYOC/OpenSSL/Release';opensslVersion='3.5.9'} | ConvertTo-Json | Set-Content "$stage/build.json" -Encoding UTF8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX and installer extensions
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path build/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          foreach ($extension in @('WixToolset.UI.wixext','WixToolset.Util.wixext')) {
            ./build/wix/wix.exe extension add "$extension/6.0.2"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension installation failed: $extension" }
          }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Core runtime
        if: inputs.core_run_id == ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\core-runtime
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
      - name: Verify Core and build monitor
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          $files = @(Get-ChildItem build/core-runtime -File | Where-Object Extension -in '.exe','.dll' | Select-Object -ExpandProperty FullName)
          ./build/core-source/windows/verify-signatures.ps1 -Path $files -ExpectedSubject $env:SIGNER_SUBJECT
          ./build/monitor/windows/build.ps1 -Configuration Release
      - name: Sign monitor and control helper
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\build\monitor\build\bin\Release\edge-core-monitor.exe
            ${{ github.workspace }}\build\monitor\build\bin\Release\izuma-edge-ctl.exe
          exclude-environment-credential: true
      - name: Stage core package from verified runtime
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          ./build/core-source/windows/verify-signatures.ps1 -Path build/monitor/build/bin/Release/edge-core-monitor.exe,build/monitor/build/bin/Release/izuma-edge-ctl.exe -ExpectedSubject $env:SIGNER_SUBJECT
          New-Item -ItemType Directory build/core/bin/Release,build/licenses -Force | Out-Null
          foreach ($name in @('edge-core.exe','edge-provision.exe','event.dll','event_core.dll','libcrypto-3-x64.dll','libssl-3-x64.dll')) { Copy-Item -LiteralPath "build/core-runtime/$name" -Destination build/core/bin/Release }
          @('BYOC_MODE:BOOL=ON','DEVELOPER_MODE:BOOL=OFF','MBED_CLOUD_CLIENT_USE_OPENSSL:BOOL=ON') | Set-Content build/core/CMakeCache.txt
          Copy-Item build/core-runtime/openssl-LICENSE.txt build/licenses/LICENSE.txt
          ./windows/build-package.ps1 -BuildDirectory build/core -EdgeRepositoryDirectory build/core-source -Version $env:RELEASE_VERSION -OutputDirectory build/package -VisualCppDeployment app-local -OpenSSLSourceDirectory build/licenses
      - name: Sign core catalog
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\package\edge-core-${{ steps.source.outputs.version }}-windows-x64\package.cat
          exclude-environment-credential: true
      - name: Prepare MSI bundle
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          $core = "build/package/edge-core-$env:RELEASE_VERSION-windows-x64"
          ./build/core-source/windows/verify-signatures.ps1 -Path "$core/package.cat" -ExpectedSubject $env:SIGNER_SUBJECT
          $thumbprint = (Get-AuthenticodeSignature -LiteralPath "$core/package.cat").SignerCertificate.Thumbprint
          ./windows/prepare-msi-bundle.ps1 -CorePackageDirectory $core -MonitorRepositoryDirectory build/monitor -OutputDirectory build/bundle -SignerThumbprint $thumbprint
      - name: Sign bundle catalog
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\build\bundle\bundle\bundle.cat
          exclude-environment-credential: true
      - name: Prepare native MSI custom action and WiX source
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          ./build/core-source/windows/verify-signatures.ps1 -Path build/bundle/bundle/bundle.cat -ExpectedSubject $env:SIGNER_SUBJECT
          ./windows/build-msi.ps1 -BundleDirectory build/bundle/bundle -OutputDirectory build/msi -PrepareOnly
      - name: Sign native MSI custom action
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\build\msi\native\Release\edge_msi_actions.dll
            ${{ github.workspace }}\build\msi\native\Release\edge-provisioning-wizard.exe
          exclude-environment-credential: true
      - name: Compile MSI with signed contents
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
        run: |
          ./build/core-source/windows/verify-signatures.ps1 -Path build/msi/native/Release/edge_msi_actions.dll,build/msi/native/Release/edge-provisioning-wizard.exe -ExpectedSubject $env:SIGNER_SUBJECT
          $result = Get-Content build/msi/msi-result.json -Raw | ConvertFrom-Json
          ./build/wix/wix.exe build $result.wixSource -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -out $result.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI compilation failed.' }
      - name: Sign MSI
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\msi
          files-folder-filter: msi
          exclude-environment-credential: true
      - name: Verify and stage final release artifacts
        env:
          SIGNER_SUBJECT: ${{ vars.AZURE_SIGNER_SUBJECT }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          CORE_RUN_ID: ${{ inputs.core_run_id || github.run_id }}
          CORE_RUN_REPOSITORY: ${{ inputs.core_run_id && 'PelionIoT/mbed-edge' || github.repository }}
          CORE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          New-Item -ItemType Directory build/release | Out-Null
          $msi = (Get-Content build/msi/msi-result.json -Raw | ConvertFrom-Json).msi
          ./build/core-source/windows/verify-signatures.ps1 -Path $msi,build/core-runtime/edge-core.exe,build/core-runtime/edge-provision.exe,build/monitor/build/bin/Release/edge-core-monitor.exe,build/monitor/build/bin/Release/izuma-edge-ctl.exe -ExpectedSubject $env:SIGNER_SUBJECT -ReportPath build/release/signatures.json
          Copy-Item -LiteralPath $msi -Destination build/release
          Copy-Item build/core-runtime/edge-core.exe -Destination build/release
          Copy-Item build/core-runtime/edge-provision.exe -Destination build/release
          Copy-Item build/monitor/build/bin/Release/edge-core-monitor.exe,build/monitor/build/bin/Release/izuma-edge-ctl.exe -Destination build/release
          Compress-Archive -LiteralPath "build/package/edge-core-$env:RELEASE_VERSION-windows-x64" -DestinationPath "build/release/edge-core-$env:RELEASE_VERSION-windows-x64-signed.zip"
          @{coreRunId=$env:CORE_RUN_ID;coreRunRepository=$env:CORE_RUN_REPOSITORY;coreCommit=$env:CORE_COMMIT;installerCommit=$env:GITHUB_SHA;monitorCommit=(git -C build/monitor rev-parse HEAD)} | ConvertTo-Json | Set-Content build/release/source.json -Encoding UTF8
          Get-ChildItem build/release -File | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content build/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: izuma-edge-windows-x64-signed
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  qualify-msi:
    needs: [package, portable-converter]
    if: always() && needs.package.result == 'success' && (needs.portable-converter.result == 'success' || needs.portable-converter.result == 'skipped')
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: izuma-edge-windows-x64-signed
          path: build/release
      - uses: actions/download-artifact@v4
        if: inputs.core_run_id == ''
        with:
          name: izuma-edge-synthetic-provisioning-fixture
          path: build/fixture
      - name: Test the single MSI without a shared runtime
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          Expand-Archive -LiteralPath "build/release/edge-core-$env:RELEASE_VERSION-windows-x64-signed.zip" -DestinationPath build/core-package
          $extra=@{}
          if (Test-Path build/fixture/provisioning-fixture.c) { $extra.DeveloperFixturePath="$pwd/build/fixture/provisioning-fixture.c" }
          ./test/windows-core/test-msi-release.ps1 -MsiPath "build/release/izuma-edge-$env:RELEASE_VERSION-windows-x64.msi" -CorePackageDirectory "build/core-package/edge-core-$env:RELEASE_VERSION-windows-x64" -OutputDirectory build/msi-tests @extra
      - name: Retain MSI qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: izuma-edge-msi-qualification
          path: build/msi-tests/
          if-no-files-found: warn
          retention-days: 30
